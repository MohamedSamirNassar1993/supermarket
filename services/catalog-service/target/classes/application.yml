server:
  port: 8082

spring:
  application:
    name: catalog-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

supermarket:
  security:
    jwt:
      secret: change-me-to-a-secure-secret-key-at-least-256-bits-long-for-hs256
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    public-paths:
      - /api/v1/health
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /actuator/health
      - /api/v1/products/internal/**
      - /api/v1/products/internal/**
  redis:
    enabled: true
  rabbitmq:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

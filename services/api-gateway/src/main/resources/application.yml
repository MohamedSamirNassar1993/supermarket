server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**
          order: 10
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/brands/**,/api/v1/units/**,/api/v1/barcodes/**
          order: 20
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**,/api/v1/stock-batches/**,/api/v1/warehouses/**
          order: 30
        - id: procurement-service
          uri: lb://procurement-service
          predicates:
            - Path=/api/v1/suppliers/**,/api/v1/purchases/**
          order: 40
        - id: sales-service
          uri: lb://sales-service
          predicates:
            - Path=/api/v1/customers/**,/api/v1/sales/**,/api/v1/promotions/**,/api/v1/pos/**
          order: 50
        - id: operations-service
          uri: lb://operations-service
          predicates:
            - Path=/api/v1/expenses/**,/api/v1/losses/**,/api/v1/hr/**,/api/v1/payroll/**
          order: 60
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/dashboard/**,/api/v1/reports/**,/api/v1/financial/**,/api/v1/ai/**
          order: 70
        - id: platform-service
          uri: lb://platform-service
          predicates:
            - Path=/api/v1/platform/**
          order: 80
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          order: 90
        - id: health
          uri: lb://platform-service
          predicates:
            - Path=/api/v1/health
          order: 5

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

supermarket:
  security:
    jwt:
      public-key: ${JWT_PUBLIC_KEY:}

logging:
  level:
    org.springframework.cloud.gateway: INFO
